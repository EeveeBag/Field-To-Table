name: ATR Scan

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '.claude/**'
      - '.codex/**'
      - 'mcp/**'
      - 'prompts/**'
      - 'skills/**'
      - 'agents/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: atr-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ATR Scan
        id: atr
        continue-on-error: true
        uses: Agent-Threat-Rule/agent-threat-rules@main
        with:
          path: '.'
          severity: 'medium'
          fail-on-finding: 'true'
          upload-sarif: 'true'

      - name: Summarize ATR findings
        id: atr_summary
        if: always()
        env:
          ATR_OUTCOME: ${{ steps.atr.outcome }}
        run: |
          set -euo pipefail

          SARIF_FILE="atr-results.sarif"
          {
            echo "## ATR findings"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$SARIF_FILE" ]]; then
            echo "No SARIF file was generated." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$ATR_OUTCOME" == "failure" ]]; then
              echo "has_findings=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_findings=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          result_count="$(jq '[.runs[].results[]?] | length' "$SARIF_FILE")"
          if [[ "$result_count" -gt 0 ]]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Found ${result_count} finding(s)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$result_count" -eq 0 ]]; then
            echo "No findings." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -r '
            .runs[].results[]? |
            "- \(.ruleId // "unknown-rule") | \(.message.text // "No message") | \(.locations[0].physicalLocation.artifactLocation.uri // "unknown"):\(.locations[0].physicalLocation.region.startLine // 1)"
          ' "$SARIF_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on ATR findings
        if: steps.atr_summary.outputs.has_findings == 'true' || steps.atr.outcome == 'failure'
        run: exit 1
